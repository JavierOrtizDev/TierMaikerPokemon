<section>
  <article class="tier">
    <app-tier #tier (pokemonDropped)="onPokemonDropped($event)"></app-tier>
  </article>

  <article class="pokefilter">
    <app-pokefilters
      (filtersChanged)="onFiltersChanged($event)"
    ></app-pokefilters>
  </article>

  <article
    class="browser-pokemon"
    (dragover)="onDragOver($event)"
    (drop)="onDropToBrowser($event)"
  >
    <app-pokemon-card
      *ngFor="let p of pokemons"
      [pokemon]="p"
      draggable="true"
      (dragstart)="onDragStart($event, p, 'browser')"
    ></app-pokemon-card>
  </article>
  <article>
    <app-paginator-controler
      [totalItems]="totalPokemons"
      [itemsPerPage]="limit"
      [currentPage]="currentPage"
      (pageChange)="onPageChange($event)"
    ></app-paginator-controler>
  </article>
</section>
